name: Check kit files
on: [push, pull_request]
jobs:
  structural-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_pptx.py templates/academic-paper.pptx --slides 7 --require-notes --allow-placeholders
      - run: python scripts/check_pptx.py templates/academic-ink.pptx --slides 7 --require-notes --allow-placeholders
      - run: python scripts/check_pptx.py examples/mean-median.pptx --slides 8 --require-notes
      - run: python scripts/check_pptx.py examples/marketing/manajemen-pemasaran.pptx --slides 16 --require-notes

name: Usulan pengembangan
description: Kebutuhan dosen, template, atau perbaikan alur.
title: "[Usulan] "
body:
  - type: textarea
    id: need
    attributes:
      label: Kebutuhan dan contoh penggunaan
      description: Jelaskan pengguna, kebutuhan kuliah, dan hasil yang diinginkan.
    validations:
      required: true
  - type: textarea
